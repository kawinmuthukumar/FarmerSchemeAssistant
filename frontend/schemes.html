<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Government Schemes matched for you – View eligible subsidies and benefits."/>
  <title>Schemes | Farmer Scheme Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <!-- HEADER -->
  <header class="header" id="top">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🌾</span>
        <div>
          <span class="logo-text" data-en="Farmer Scheme Assistant" data-ta="கிசான் திட்ட உதவியாளர்">Farmer Scheme Assistant</span>
          <span class="logo-sub" data-en="Your Digital Farming Companion" data-ta="உங்கள் டிஜிட்டல் விவசாய நண்பர்">Your Digital Farming Companion</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="lang-toggle" id="langToggle" title="Switch Language / மொழி மாற்று">
          <span id="langLabel">தமிழ்</span>
        </button>
        <nav class="nav-links">
          <a href="profile.html" class="nav-link" data-en="Profile" data-ta="சுயவிவரம்">Profile</a>
          <a href="schemes.html" class="nav-link active" data-en="Schemes" data-ta="திட்டங்கள்">Schemes</a>
          <a href="chatbot.html" class="nav-link" data-en="Chatbot" data-ta="அரட்டை">Chatbot</a>
        </nav>
        <button class="btn-logout" id="logoutBtn" title="Logout">🚪 <span data-en="Logout" data-ta="வெளியேறு">Logout</span></button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-container">

    <!-- RESULTS SECTION -->
    <section id="schemes-section" class="section" aria-live="polite">
      <div class="section-header results-header">
        <h2>
          <span class="section-icon">🎯</span>
          <span data-en="Recommended Schemes for" data-ta="பரிந்துரைக்கப்பட்ட திட்டங்கள்">Recommended Schemes for</span>
          <span id="resultName" class="highlight-name"></span>
        </h2>
        <p id="matchCount"></p>
      </div>
      <div id="schemesGrid" class="schemes-grid"></div>
      <div class="no-schemes" id="noSchemes">
        <div class="no-schemes-icon">📋</div>
        <p data-en="No schemes found yet. Please fill your profile first." data-ta="இன்னும் திட்டங்கள் கிடைக்கவில்லை. முதலில் உங்கள் சுயவிவரத்தை நிரப்பவும்.">No schemes found yet. Please fill your profile first.</p>
        <a href="profile.html" class="btn-primary" style="display:inline-flex;margin-top:1rem;">
          <span class="btn-icon">👤</span>
          <span data-en="Go to Profile" data-ta="சுயவிவரத்திற்கு செல்">Go to Profile</span>
        </a>
      </div>
    </section>

    <!-- SCHEME DETAIL MODAL OVERLAY -->
    <div class="modal-overlay hidden" id="modalOverlay">
      <div class="modal" id="schemeModal" role="dialog" aria-modal="true">
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
        <div id="modalContent"></div>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <p data-en="© 2025 Farmer Scheme Assistant — For Educational / Project Demonstration Purposes" data-ta="© 2025 கிசான் திட்ட உதவியாளர் — கல்வி / திட்ட நிரூபண நோக்கங்களுக்காக">© 2025 Farmer Scheme Assistant — For Educational / Project Demonstration Purposes</p>
      <p class="footer-sub" data-en="Built with ❤️ for Indian Farmers" data-ta="இந்திய விவசாயிகளுக்காக ❤️ உடன் கட்டப்பட்டது">Built with ❤️ for Indian Farmers</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
